<?xml version="1.0" encoding="UTF-8"?>
<!-- Savage Wheels' GlowIcon art: a spiked red derby car seen from above,
     skidding on a dusty arena floor, tyre marks behind it. The AmiCradle
     Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9b77a"/><stop offset="1" stop-color="#9c7444"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0b0b"/><stop offset="0.45" stop-color="#e2352a"/><stop offset="1" stop-color="#7a0b0b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/><stop offset="1" stop-color="#2b5f8c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="10" fill="url(#floor)" stroke="#4a3216" stroke-width="3"/>
  <!-- tyre marks -->
  <g fill="none" stroke="#3b2a17" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M18 116 q10 -30 34 -40"/>
    <path d="M40 120 q8 -26 30 -34"/>
  </g>
  <!-- the car, turned as it skids -->
  <g transform="rotate(35 70 56)">
    <!-- wheels -->
    <g fill="#1d1d1d" stroke="#000" stroke-width="1.5">
      <rect x="44" y="26" width="10" height="20" rx="3"/>
      <rect x="86" y="26" width="10" height="20" rx="3"/>
      <rect x="44" y="70" width="10" height="20" rx="3"/>
      <rect x="86" y="70" width="10" height="20" rx="3"/>
    </g>
    <!-- spikes on the bumper -->
    <g fill="#d8d8d8" stroke="#555" stroke-width="1.2" stroke-linejoin="round">
      <path d="M56 22 l3 -12 3 12z"/>
      <path d="M67 20 l3 -14 3 14z"/>
      <path d="M78 22 l3 -12 3 12z"/>
    </g>
    <!-- body -->
    <path d="M52 22 h36 q6 0 6 8 v58 q0 8 -8 8 h-32 q-8 0 -8 -8 v-58 q0 -8 6 -8z"
          fill="url(#body)" stroke="#3d0505" stroke-width="2.5"/>
    <!-- windscreen and roof -->
    <path d="M57 40 h26 l-3 14 h-20z" fill="url(#glass)" stroke="#12324d" stroke-width="1.5"/>
    <rect x="60" y="56" width="20" height="18" rx="3" fill="#a81b14" stroke="#3d0505" stroke-width="1.5"/>
    <!-- racing stripe and number -->
    <rect x="68" y="24" width="4" height="14" fill="#ffd93b"/>
    <circle cx="70" cy="82" r="7" fill="#fff" stroke="#3d0505" stroke-width="1.5"/>
    <path d="M67 79 h6 l-4 7" fill="none" stroke="#111" stroke-width="2"/>
  </g>
  <!-- dust -->
  <g fill="#f3e2bd" opacity="0.8">
    <circle cx="24" cy="98" r="6"/><circle cx="32" cy="106" r="4"/><circle cx="16" cy="108" r="3"/>
  </g>
</svg>
